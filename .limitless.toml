# Gates and policy the Limitless factory applies when it works on this repository.
[gates]
setup = ["bun install --frozen-lockfile"]
checks = [
  { name = "lint", run = "bun run lint" },
  { name = "typecheck", run = "bun run typecheck" },
  # The full suite takes about 18 minutes while two gates and a land check share the machine (2026-10-04),
  # so the 900 s default timed out the test gate in nearly every run, and a check that also times out
  # on the base counts as still failing and doesn't block.
  { name = "test", run = "bun test --parallel=$(bun -p 'const v=process.env.LIMITLESS_TEST_WORKERS ?? \"\"; const n=Number(v); /^\\d+$/.test(v) && Number.isSafeInteger(n) && n>0 ? n : 4')", timeoutSec = 1800 },
]

[policy]
# Changes to the factory itself are reviewed by the orchestrator before merging.
merge = "pr"
protected_paths = ["test/fixtures/**"]

[preview]
paths = ["ui/"]
build = "bun run build:ui"
serve = "bun src/cli/main.ts serve"
env = { LIMITLESS_HOME = "{scratch}/home", LIMITLESS_CONFIG_DIR = "{scratch}/config", LIMITLESS_PORT = "{port}" }
seed = "bun scripts/preview-seed.ts"
ready = "/api/health"

# Review lenses are read from the base commit, so a change never sets the lenses that review it.
[[review.lenses]]
name = "compatibility-and-operations"
focus = """
Compatibility with the running release and rollback: the previous release must keep working with \
the database, run state and files the new one writes, and the new one with what the previous one left. \
Restart and resume: a run interrupted at any step resumes without losing state or repeating paid work \
or side effects (commits, pushes, PR comments). Migrations: additive, in a new timestamped file, never \
an edit to a shipped one. Trust in inputs from the change under test: configuration, scripts, test \
output and reports that come from the change are untrusted data; what steers the factory comes from \
the base commit."""
